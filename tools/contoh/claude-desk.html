<!doctype html>
<!-- Claude Desktop, Code mode, rebuilt from a reference capture of the real app (29 Okt 2026) with the app's own
     labels (read from its interface strings). Example account and project only.
     ?state= chat | code | folders | ready | prompt | allow | working | done | skill-allow | skill-done.
     The click target is marked data-target. Skill install: &skill=<name>, &code=<path or command shown in the card>,
     &card=<card title>, &langkah=<step|step> on the done screen; &recent=<title> fills Recents (a new session after
     the install). &tajuk= keeps the session title, &kata= Claude's line on the allow card (a skill made in the ad
     session). done: &jawab= Claude's last words, &isi= text already typed in the box (then the send button is the target). -->
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,500&display=swap">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1200px; height: 800px; overflow: hidden; }
  body { font-family: Inter, -apple-system, system-ui, sans-serif; background: #1f1e1c; color: #e8e6df; font-size: 14px; }
  .win { position: absolute; inset: 0; border-radius: 12px; overflow: hidden; background: #262624; display: grid; grid-template-columns: 350px 1fr; }
  aside { background: #1f1e1c; border-right: 1px solid #34332f; padding: 12px 10px; display: flex; flex-direction: column; gap: 4px; }
  .top { display: flex; align-items: center; gap: 8px; height: 30px; padding-left: 4px; }
  .dots { display: flex; gap: 8px; } .dots i { width: 12px; height: 12px; border-radius: 50%; display: block; }
  .seg { margin-left: auto; display: flex; gap: 4px; background: #2b2a27; border-radius: 9px; padding: 3px; }
  .seg span { width: 34px; height: 26px; border-radius: 7px; display: grid; place-items: center; color: #b7b4aa; }
  .seg span.on { background: #45443f; color: #f2f0e8; }
  .seg svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  .item { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; color: #d9d6cc; font-size: 14.5px; }
  .item.new { background: #34332f; color: #f2f0e8; margin-top: 10px; }
  .grp { margin: 16px 10px 4px; color: #9b988e; font-size: 12.5px; }
  .me { margin-top: auto; display: flex; align-items: center; gap: 10px; padding: 8px; border-top: 1px solid #34332f; }
  .av { width: 26px; height: 26px; border-radius: 50%; background: #6e4cf0; color: #fff; display: grid; place-items: center; font-size: 12px; font-weight: 600; }
  main { position: relative; display: flex; flex-direction: column; }
  header { height: 46px; display: flex; align-items: center; padding: 0 22px; color: #9b988e; border-bottom: 1px solid #2f2e2a; }
  .body { flex: 1; padding: 26px 40px; overflow: hidden; display: flex; flex-direction: column; gap: 14px; }
  .hello { margin: auto; text-align: center; color: #c9c6bc; }
  .hello b { display: block; font-family: "Source Serif 4", Georgia, serif; font-weight: 500; font-size: 30px; color: #f2f0e8; margin-bottom: 6px; }
  .bubble { align-self: flex-end; max-width: 78%; background: #34332f; border-radius: 14px; padding: 10px 14px; line-height: 1.45; font-size: 13.5px; }
  .claude { max-width: 92%; line-height: 1.5; font-size: 14px; color: #e8e6df; }
  .claude code, .card code { font-family: ui-monospace, Menlo, monospace; font-size: 12.5px; background: #1f1e1c; border-radius: 6px; padding: 2px 6px; }
  .card { border: 1px solid #4a4843; border-radius: 12px; padding: 14px 16px; background: #2b2a27; display: grid; gap: 10px; max-width: 92%; }
  .card .t { font-weight: 600; color: #f2f0e8; }
  .btns { display: flex; gap: 8px; justify-content: flex-end; }
  .btns span { padding: 7px 14px; border-radius: 8px; border: 1px solid #4a4843; font-weight: 500; }
  .btns .pri { background: #e8e6df; color: #1f1e1c; border-color: #e8e6df; }
  .steps { display: grid; gap: 6px; font-size: 13px; color: #c9c6bc; }
  .steps span::before { content: "✓ "; color: #7fe0b5; }
  .steps span.run::before { content: "◌ "; color: #ffd95a; }
  .composer { margin: 0 34px 10px; border: 1px solid #45443f; border-radius: 16px; background: #2b2a27; padding: 12px 14px; display: grid; gap: 10px; }
  .composer .row { display: flex; align-items: flex-start; gap: 10px; }
  .composer .ph { flex: 1; color: #8c897f; font-size: 15px; min-height: 22px; }
  .composer .ph.full { color: #e8e6df; font-size: 13px; line-height: 1.45; max-height: 76px; overflow: hidden; }
  .send { width: 30px; height: 30px; border-radius: 8px; background: #d97757; display: grid; place-items: center; flex: none; align-self: flex-end; }
  .send.off { background: #45443f; }
  .send svg { width: 16px; height: 16px; stroke: #fff; stroke-width: 2.2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .chips { display: flex; gap: 14px; margin: 0 40px 14px; color: #b7b4aa; font-size: 13px; }
  .chips span { display: flex; align-items: center; gap: 6px; padding: 4px 8px; border-radius: 7px; }
  .chips svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.7; }
  .menu { position: absolute; left: 150px; bottom: 50px; width: 300px; background: #2f2e2a; border: 1px solid #4a4843; border-radius: 12px; padding: 6px; box-shadow: 0 14px 40px rgba(0,0,0,.45); display: grid; gap: 2px; }
  .menu .h { color: #9b988e; font-size: 12px; padding: 6px 10px 2px; }
  .menu span { padding: 8px 10px; border-radius: 8px; display: flex; gap: 10px; align-items: center; }
  .menu span.mute { color: #8c897f; }
  [data-target].hi:not(.pri):not(.send) { background: #3a3935; }
</style></head>
<body><div class="win">
  <aside>
    <div class="top"><span class="dots"><i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i style="background:#28c840"></i></span>
      <span class="seg"><span id="m-chat"><svg viewBox="0 0 16 16"><path d="M3 4.5A2.5 2.5 0 0 1 5.5 2h5A2.5 2.5 0 0 1 13 4.5v4A2.5 2.5 0 0 1 10.5 11H7l-3 2.5V11a2.5 2.5 0 0 1-1-2z"/></svg></span><span id="m-code"><svg viewBox="0 0 16 16"><path d="M5.5 4.5 2 8l3.5 3.5M10.5 4.5 14 8l-3.5 3.5M9 3 7 13"/></svg></span></span></div>
    <span class="item new" id="new">＋ New</span><span class="item">⌕ Search</span><span class="item">◫ Customize</span><span class="item">··· More</span>
    <span class="grp" id="grp">Recents</span><span class="item" id="recent">Belum ada tugasan</span>
    <div class="me"><span class="av">P</span><span>Pelajar Demo · Pro</span></div>
  </aside>
  <main>
    <header id="hd">New session</header>
    <div class="body" id="body"></div>
    <div class="composer" id="composer"><div class="row"><span class="ph" id="ph">Describe a task or ask a question</span><span class="send off" id="send"><svg viewBox="0 0 16 16"><path d="M8 13V3M3.5 7.5 8 3l4.5 4.5"/></svg></span></div></div>
    <div class="chips"><span><svg viewBox="0 0 16 16"><rect x="2" y="3" width="12" height="8" rx="1.5"/><path d="M5 14h6"/></svg>This computer</span><span id="folder"><svg viewBox="0 0 16 16"><path d="M2 4.5h4l1.5 1.5H14v6.5H2z"/></svg><b id="fname" style="font-weight:500">Select folder</b></span><span>Auto</span><span style="margin-left:auto">Opus</span></div>
  </main>
</div>
<script>
  const q = new URLSearchParams(location.search)
  const st = q.get('state') || 'code'
  // On Windows the app has no traffic lights; the Windows frame around it comes from tools/win/app.html.
  if (q.get('os') === 'win') document.querySelector('.dots').style.visibility = 'hidden'
  const P = q.get('project') || '2026-10-29 Iklan Umrah'
  const $ = (id) => document.getElementById(id)
  const mark = (el) => { el.dataset.target = ''; el.classList.add('hi') }
  $(st === 'chat' ? 'm-chat' : 'm-code').classList.add('on')
  if (st === 'chat') { $('hd').textContent = 'New chat'; $('body').innerHTML = '<div class="hello"><b>Good afternoon, Pelajar</b>How can I help you today?</div>'; $('ph').textContent = 'How can I help you today?'; mark($('m-code')); document.querySelector('.chips').style.visibility = 'hidden' }
  if (st === 'code' || st === 'folders') { $('body').innerHTML = '<div class="hello"><b>What should we build?</b>Pick a folder, then describe the task.</div>'; if (st === 'code') mark($('folder')) }
  if (st === 'folders') {
    const m = document.createElement('div'); m.className = 'menu'
    m.innerHTML = '<span class="h">Recent</span><span class="mute">No recent folders</span><span id="choose">📁 Choose a folder</span>'
    document.querySelector('main').appendChild(m); mark($('choose'))
  }
  if (['ready', 'prompt', 'allow', 'working', 'done', 'skill-allow', 'skill-done'].includes(st)) $('fname').textContent = P
  if (q.get('recent')) $('recent').textContent = q.get('recent')
  const S = q.get('skill') || 'iklan-video'
  const skillPath = q.get('code') || '~/.claude/skills/' + S + '/SKILL.md'
  if (st === 'skill-allow' || st === 'skill-done') {
    const title = q.get('tajuk') || 'Pasang skill ' + S
    $('hd').textContent = title; $('recent').textContent = title
    const bubble = '<div class="bubble">' + (q.get('text') || '').slice(0, 150) + '…</div>'
    if (st === 'skill-allow') {
      $('body').innerHTML = bubble + '<div class="claude">' + (q.get('kata') || 'Saya pasang skill <code>' + S + '</code> dalam folder skills Claude awak.') + '</div>' +
        '<div class="card"><span class="t">' + (q.get('card') || 'Allow Claude to write this file?') + '</span><code>' + skillPath + '</code><div class="btns"><span>Deny</span><span>Always allow</span><span class="pri" id="once">Allow once</span></div></div>'
      mark($('once'))
    } else {
      const langkah = (q.get('langkah') || 'Cipta folder skills/' + S + '|Tulis SKILL.md').split('|')
      $('body').innerHTML = bubble + '<div class="steps">' + langkah.map((l) => '<span>' + l + '</span>').join('') + '</div>' +
        '<div class="claude">Skill <b>' + S + '</b> dah dipasang di <code>' + skillPath + '</code>, untuk semua folder projek. Untuk guna, mulakan prompt dengan: <b>Guna skill ' + S + '.</b></div>'
      mark($('new'))
    }
  }
  if (st === 'ready') { $('body').innerHTML = '<div class="hello"><b>What should we build?</b>Claude will work in <b style="display:inline;font:inherit;color:#f2f0e8">' + P + '</b>.</div>'; mark($('composer')) }
  if (st === 'prompt') { $('body').innerHTML = '<div class="hello"><b>What should we build?</b></div>'; $('ph').className = 'ph full'; $('ph').textContent = q.get('text') || ''; $('send').classList.remove('off'); mark($('send')) }
  const ask = '<div class="bubble">' + (q.get('text') || '').slice(0, 150) + '…</div>'
  if (st === 'allow') {
    $('hd').textContent = 'Iklan umrah · POV + VO'; $('recent').textContent = 'Iklan umrah · POV + VO'
    $('body').innerHTML = ask + '<div class="claude">Saya mula dengan menyemak bahan dalam folder <code>RAW</code> dan <code>Footage</code>.</div>' +
      '<div class="card"><span class="t">Allow Claude to run this command?</span><code>ls RAW Footage</code><div class="btns"><span>Deny</span><span>Always allow</span><span class="pri" id="once">Allow once</span></div></div>'
    mark($('once'))
  }
  if (st === 'working' || st === 'done') {
    $('hd').textContent = 'Iklan umrah · POV + VO'; $('recent').textContent = 'Iklan umrah · POV + VO'
    const steps = st === 'working'
      ? '<div class="steps"><span>Baca 12 video dalam RAW dan 4 bahan dalam Footage</span><span>Tulis skrip 5 hook, POV dan VO</span><span>Jana suara VO dengan ElevenLabs</span><span class="run">Render sample 3 daripada 5…</span></div>'
      : '<div class="steps">' + (q.get('langkah') || 'Baca bahan|Tulis skrip 5 hook|Jana suara VO|Render 5 sample').split('|').map((l) => '<span>' + l + '</span>').join('') + '</div><div class="claude">' + (q.get('jawab') || 'Lima sample siap dalam folder <code>out</code>: tiga POV dan dua VO. Tonton dulu, kemudian beritahu saya nombor video dan saat yang perlu diubah.') + '</div>'
    $('body').innerHTML = ask + steps
    if (q.get('isi')) { $('ph').className = 'ph full'; $('ph').textContent = q.get('isi'); $('send').classList.remove('off'); mark($('send')) } else mark($('composer'))
  }
  document.fonts.ready.then(() => { document.body.dataset.ready = '1' })
</script>
</body></html>
