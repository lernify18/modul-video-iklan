<!doctype html>
<!-- Google "Choose an account", rebuilt from a real capture, with the book's dummy account. ?app= the app asking.
     The click target is the account row. -->
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1440px; height: 900px; overflow: hidden; }
  body { font-family: "Google Sans", Roboto, system-ui, sans-serif; background: #f0f4f9; color: #1f1f1f; }
  .card { position: absolute; left: 200px; top: 226px; width: 1040px; height: 384px; background: #fff; border-radius: 28px; }
  .bar { height: 52px; display: flex; align-items: center; gap: 12px; padding: 0 16px; border-bottom: 1px solid #c4c7c5; font-size: 14px; color: #444746; }
  .left { position: absolute; left: 36px; top: 96px; }
  .left h1 { font-size: 36px; font-weight: 400; margin: 18px 0 16px; }
  .left p { font-size: 16px; margin: 0; }
  .left a { color: #0b57d0; font-weight: 500; text-decoration: none; }
  .right { position: absolute; left: 544px; right: 36px; top: 112px; }
  .row { display: flex; align-items: center; gap: 14px; padding: 12px 8px; border-bottom: 1px solid #c4c7c5; font-size: 14px; }
  .av { width: 28px; height: 28px; border-radius: 50%; background: #6e4cf0; color: #fff; display: grid; place-items: center; font-weight: 500; font-size: 14px; }
  .row b { display: block; font-weight: 500; font-size: 14px; }
  .row small { color: #444746; font-size: 12px; }
  .note { font-size: 14px; color: #444746; margin-top: 30px; line-height: 1.45; }
  .note a { color: #0b57d0; font-weight: 500; text-decoration: none; }
  .foot { position: absolute; left: 216px; right: 216px; top: 632px; display: flex; justify-content: space-between; font-size: 12px; color: #1f1f1f; }
  .foot span + span { margin-left: 28px; }
</style></head>
<body>
  <div class="card">
    <div class="bar"><svg width="18" height="18" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>Sign in with Google</div>
    <div class="left">
      <svg width="34" height="34" viewBox="0 0 32 32"><g stroke="#d97757" stroke-width="2.6" stroke-linecap="round"><path d="M16 3v26M3 16h26M6.8 6.8l18.4 18.4M25.2 6.8L6.8 25.2M10 4.5l12 23M22 4.5l-12 23M4.5 10l23 12M27.5 10l-23 12"/></g></svg>
      <h1>Choose an account</h1>
      <p>to continue to <a id="app">Claude</a></p>
    </div>
    <div class="right">
      <div class="row" data-target><span class="av">P</span><span><b>Pelajar Demo</b><small>pelajar.demo@gmail.com</small></span></div>
      <div class="row"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#444746" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="10" r="3"/><path d="M6.5 18c1.3-2 3.2-3 5.5-3s4.2 1 5.5 3"/></svg><span><b>Use another account</b></span></div>
      <p class="note">Before using this app, you can review <span id="app2">Claude</span>'s <a>privacy policy</a> and <a>terms of service</a>.</p>
    </div>
  </div>
  <div class="foot"><span>English (United States) &#9662;</span><span><span>Help</span><span>Privacy</span><span>Terms</span></span></div>
<script>
  const app = new URLSearchParams(location.search).get('app') || 'Claude'
  document.getElementById('app').textContent = app
  document.getElementById('app2').textContent = app
  document.fonts.ready.then(() => { document.body.dataset.ready = '1' })
</script></body></html>
