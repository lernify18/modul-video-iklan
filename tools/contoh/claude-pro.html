<!doctype html>

<style>
  aside { position: absolute; left: 0; top: 0; bottom: 0; width: 250px; background: #f5f4ee; border-right: 1px solid #e8e5db; padding: 18px 14px; display: grid; align-content: start; gap: 6px; font-size: 14.5px; }

  .me small { display: block; color: #73726c; font-size: 12.5px; }

  .badge { font-size: 13px; background: #fff; border: 1px solid #e0ddd2; border-radius: 999px; padding: 5px 12px; color: #3d3d3a; }
  h1 { font-size: 44px; margin: 0; display: flex; align-items: center; gap: 14px; }
  h1 svg { width: 40px; height: 40px; }
  .box { width: 680px; height: 118px; background: #fff; border: 1px solid #e0ddd2; border-radius: 22px; padding: 18px 20px; color: #73726c; font-size: 17px; box-shadow: 0 4px 20px rgba(0,0,0,.04); }
</style></head>
